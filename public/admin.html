<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — DELTA.KEYS</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<div class="bg-orbs"><i></i><i></i><i></i></div>
<header class="nav"><a class="brand" href="/">DELTA<span>.KEYS</span></a><nav><a href="/">Store</a><a href="/products">Products</a><a class="active" href="/admin">Admin</a></nav></header>
<main class="wrap page">
  <div id="loginPanel" class="narrow">
    <div class="eyebrow">PRIVATE AREA</div><h1>Admin login</h1><p class="muted">Manage customer orders, approve payments and edit delivered keys.</p>
    <form id="loginForm" class="glass form-card">
      <label>Username<input id="user" required autocomplete="username" value="admin"></label>
      <label>Password<input id="pass" required type="password" autocomplete="current-password"></label>
      <button class="btn primary full" type="submit">Login to Admin</button><p id="loginError" class="error" role="alert"></p>
    </form>
  </div>
  <div id="dashboard" hidden>
    <div class="page-head"><div><div class="eyebrow">CONTROL PANEL</div><h1>Orders & Keys</h1><p class="muted">Approve customer payments and edit keys before delivery.</p></div><button id="logout" class="btn ghost">Log out</button></div>
    <div id="stats" class="stats"></div>
    <div id="orders" class="admin-list"></div>
  </div>
</main>
<script src="/admin.js"></script>
</body>
</html>
