<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DELTA.KEYS APK Manager</title><style>body{font-family:Arial,sans-serif;background:#0b0712;color:#fff;margin:0;padding:20px}.wrap{max-width:850px;margin:auto}.card{background:#171022;border:1px solid #3d2b55;border-radius:16px;padding:18px;margin:14px 0}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn{background:#8b5cf6;color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:700}.danger{background:#dc2626}.muted{color:#aaa}.file{max-width:100%}h1{margin-bottom:4px}input[type=password]{background:#0e0a16;color:#fff;border:1px solid #49355f;border-radius:8px;padding:10px;width:100%;box-sizing:border-box}#login{max-width:420px;margin:60px auto}</style></head><body><div class="wrap"><div id="login" class="card"><h1>🔐 APK Manager</h1><p class="muted">DELTA.KEYS admin access</p><input id="user" placeholder="Admin username" value="admin"><br><br><input id="pass" type="password" placeholder="Admin password"><br><br><button class="btn" onclick="login()">Login</button><p id="loginMsg"></p></div><div id="app" style="display:none"><h1>📦 DELTA.KEYS APK Manager</h1><p class="muted">Upload, replace or remove the APK attached to each product.</p><div id="products"></div></div></div><script>let auth='';function login(){const u=document.getElementById('user').value.trim(),p=document.getElementById('pass').value;auth='Basic '+btoa(u+':'+p);load().catch(e=>{document.getElementById('loginMsg').textContent='❌ '+e.message})}async function api(url,opt={}){opt.headers=Object.assign({},opt.headers||{},{Authorization:auth});const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Request failed');return d}async function load(){const d=await api('/api/admin/apks');document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('products').innerHTML=d.products.map(p=>`<div class="card"><div class="row"><div><h2>${esc(p.name)}</h2>${p.apk?`<div class="muted">Current APK: ${esc(p.apk.originalName||p.apk.filename)} • ${fmt(p.apk.size)}</div>`:'<div class="muted">No APK attached</div>'}</div>${p.apk?`<button class="btn danger" onclick="removeApk('${p.id}')">Remove APK</button>`:''}</div><br><input class="file" id="file-${p.id}" type="file" accept=".apk,application/vnd.android.package-archive"><br><br><button class="btn" onclick="uploadApk('${p.id}')">${p.apk?'Replace APK':'Upload APK'}</button><span id="msg-${p.id}" class="muted"></span></div>`).join('')}async function uploadApk(id){const f=document.getElementById('file-'+id).files[0];if(!f)return alert('Select an APK first.');if(!f.name.toLowerCase().endsWith('.apk'))return alert('Only .apk files are allowed.');const fd=new FormData();fd.append('apk',f);document.getElementById('msg-'+id).textContent=' Uploading...';try{await api('/api/admin/products/'+encodeURIComponent(id)+'/apk',{method:'POST',body:fd});await load()}catch(e){document.getElementById('msg-'+id).textContent=' ❌ '+e.message}}async function removeApk(id){if(!confirm('Remove this product APK?'))return;try{await api('/api/admin/products/'+encodeURIComponent(id)+'/apk',{method:'DELETE'});await load()}catch(e){alert(e.message)}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(n){n=Number(n||0);return n>1048576?(n/1048576).toFixed(1)+' MB':(n/1024).toFixed(0)+' KB'}
</script></body></html>
