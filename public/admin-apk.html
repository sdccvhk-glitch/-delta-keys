<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DELTA.KEYS — APK Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1225;color:#e7edf8;font-family:Inter,system-ui,Arial,sans-serif}
.wrap{max-width:1000px;margin:auto;padding:22px}.top{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.logo{width:58px;height:58px;border-radius:16px;background:#f8b91d;display:grid;place-items:center;font-size:30px}
.title{font-size:26px;font-weight:800}.sub{color:#8fa0bb;font-size:14px;margin-top:3px}
.back{margin-left:auto;background:#17223b;color:#dce5f5;border:1px solid #33415f;border-radius:12px;padding:12px 16px;text-decoration:none}
.card{background:#111b32;border:1px solid #263655;border-radius:18px;padding:18px;margin-bottom:16px}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.name{font-size:19px;font-weight:800}
.meta{color:#9aabc5;font-size:13px;margin-top:5px}.status{margin-left:auto;color:#aebbd0}
.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:800;cursor:pointer;background:#243453;color:#fff;text-decoration:none;display:inline-block}
.primary{background:#f4b51f;color:#111827}.danger{background:#522533}.file{max-width:100%;padding:10px;background:#0c1428;border:1px dashed #405173;border-radius:10px;color:#c8d4e7}
.msg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#182541;border:1px solid #3b4d70;border-radius:12px;padding:12px 18px;display:none;z-index:10}
.empty{color:#93a3bd;text-align:center;padding:25px}.small{font-size:12px;color:#8495b0;margin-top:7px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
 <div class="top">
  <div class="logo">📱</div>
  <div><div class="title">APK Manager</div><div class="sub">Manage the APK attached to each DELTA.KEYS product</div></div>
  <a class="back" href="/admin/dashboard">← Admin Panel</a>
 </div>
 <div id="list"><div class="empty">Loading products…</div></div>
 <div id="msg" class="msg"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const auth=localStorage.getItem('delta:adminAuth')||sessionStorage.getItem('delta:adminAuth')||'';

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function size(n){n=Number(n||0);if(!n)return '—';let u=['B','KB','MB','GB'],i=0;while(n>=1024&&i<3){n/=1024;i++}return `${n.toFixed(i?1:0)} ${u[i]}`}
function show(t){const m=$('#msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',3000)}

async function request(url,opt={}){
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),15000);
 try{
  const headers={...(opt.headers||{}),Authorization:auth};
  const r=await fetch(url,{...opt,headers,signal:controller.signal,cache:'no-store'});
  let d={}; try{d=await r.json()}catch{}
  if(r.status===401) throw new Error(d.error||'Admin authentication expired. Please log in again.');
  if(!r.ok) throw new Error(d.error||`Request failed (${r.status})`);
  return d;
 }finally{clearTimeout(timer)}
}

async function load(){
 $('#list').innerHTML='<div class="empty">Loading products…</div>';
 try{
  let d;
  try{ d=await request('/api/admin/apks'); }
  catch(first){
   // Fallback to the main admin data endpoint used by the dashboard.
   const main=await request('/api/admin/data');
   d={products:main.products||[]};
  }
  render(d.products||[]);
 }catch(e){
  const msg=e.name==='AbortError'?'The server took too long to respond.':e.message;
  $('#list').innerHTML=`<div class="card empty"><b>Could not load products.</b><br><br>${esc(msg)}<br><br><button class="btn primary" onclick="load()">Retry</button></div>`;
 }
}

function render(products){
 if(!products.length){$('#list').innerHTML='<div class="card empty">No products found.</div>';return}
 $('#list').innerHTML=products.map(p=>{
  const a=p.apk;
  const exists=!!(a&&a.exists!==false);
  return `<div class="card">
   <div class="row"><div><div class="name">${esc(p.name)}</div><div class="meta">Product ID: ${esc(p.id)}</div></div>
   <div class="status">${exists?'✅ APK attached':'⚠️ No APK'}</div></div>
   ${a?`<div class="meta" style="margin-top:15px">Current APK: <b>${esc(a.originalName||'APK')}</b> · ${size(a.size)}</div>`:''}
   <div class="actions">
    <input class="file" id="f-${esc(p.id)}" type="file" accept=".apk,application/vnd.android.package-archive">
    <button class="btn primary" onclick="upload('${encodeURIComponent(p.id)}')">${exists?'Replace APK':'Upload APK'}</button>
    ${exists?`<button class="btn" onclick="downloadApk('${encodeURIComponent(p.id)}','${encodeURIComponent(a.originalName||'app.apk')}')">Download</button><button class="btn danger" onclick="removeApk('${encodeURIComponent(p.id)}')">Remove APK</button>`:''}
   </div>
   <div class="small">Maximum upload size: 250 MB. Only .apk files are accepted.</div>
  </div>`;
 }).join('');
}

async function upload(id){
 id=decodeURIComponent(id);const input=document.getElementById('f-'+id);
 if(!input||!input.files[0])return show('Select an APK first.');
 const fd=new FormData();fd.append('apk',input.files[0]);
 try{await request('/api/admin/products/'+encodeURIComponent(id)+'/apk',{method:'POST',body:fd});show('APK uploaded successfully.');await load()}
 catch(e){show(e.message)}
}

async function removeApk(id){
 id=decodeURIComponent(id);if(!confirm('Remove this product APK?'))return;
 try{await request('/api/admin/products/'+encodeURIComponent(id)+'/apk',{method:'DELETE'});show('APK removed.');await load()}
 catch(e){show(e.message)}
}

async function downloadApk(id,name){
 try{
  const r=await fetch('/admin/apk/download/'+encodeURIComponent(decodeURIComponent(id)),{headers:{Authorization:auth},cache:'no-store'});
  if(!r.ok){let d={};try{d=await r.json()}catch{};throw new Error(d.error||'Download failed')}
  const blob=await r.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=decodeURIComponent(name)||'app.apk';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
 }catch(e){show(e.message)}
}

load();
</script>
</body>
</html>
