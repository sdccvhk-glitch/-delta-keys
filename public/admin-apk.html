<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DELTA.KEYS — APK Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1225;color:#e7edf8;font-family:Inter,system-ui,Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:22px}.top{display:flex;align-items:center;gap:14px;margin-bottom:22px}.logo{width:58px;height:58px;border-radius:16px;background:#f8b91d;display:grid;place-items:center;font-size:30px}.title{font-size:26px;font-weight:800}.sub{color:#8fa0bb;font-size:14px;margin-top:3px}.back{margin-left:auto;background:#17223b;color:#dce5f5;border:1px solid #33415f;border-radius:12px;padding:12px 16px;text-decoration:none}.card{background:#111b32;border:1px solid #263655;border-radius:18px;padding:18px;margin-bottom:16px}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.name{font-size:19px;font-weight:800}.meta{color:#9aabc5;font-size:13px;margin-top:5px}.status{margin-left:auto;color:#aebbd0}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:800;cursor:pointer;background:#243453;color:#fff}.primary{background:#f4b51f;color:#111827}.danger{background:#522533}.file{max-width:100%;padding:10px;background:#0c1428;border:1px dashed #405173;border-radius:10px;color:#c8d4e7}.msg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#182541;border:1px solid #3b4d70;border-radius:12px;padding:12px 18px;display:none;z-index:10}.empty{color:#93a3bd;text-align:center;padding:25px}.small{font-size:12px;color:#8495b0;margin-top:7px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
</style></head>
<body><div class="wrap">
<div class="top"><div class="logo">📱</div><div><div class="title">APK Manager</div><div class="sub">Manage the APK attached to each DELTA.KEYS product</div></div><a class="back" href="/admin/dashboard">← Admin Panel</a></div>
<div id="list"><div class="empty">Loading products…</div></div>
<div id="msg" class="msg"></div>
</div>
<script>
const $=s=>document.querySelector(s);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function size(n){n=Number(n||0);if(!n)return '—';let u=['B','KB','MB','GB'],i=0;while(n>=1024&&i<3){n/=1024;i++}return `${n.toFixed(i?1:0)} ${u[i]}`}
function show(t){const m=$('#msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',2800)}
const auth=localStorage.getItem('delta:adminAuth')||sessionStorage.getItem('delta:adminAuth')||'';
async function load(){try{const r=await fetch('/api/admin/apks',{headers:{Authorization:auth}});if(!r.ok)throw new Error('Admin login required');const d=await r.json();render(d.products||[])}catch(e){$('#list').innerHTML='<div class="empty">Unable to load APK Manager. Please log in to the Admin Panel first.</div>'}}
function render(products){if(!products.length){$('#list').innerHTML='<div class="card empty">No products found.</div>';return}$('#list').innerHTML=products.map(p=>{const a=p.apk;return `<div class="card"><div class="row"><div><div class="name">${esc(p.name)}</div><div class="meta">Product ID: ${esc(p.id)}</div></div><div class="status">${a&&a.exists?'✅ APK attached':'⚠️ No APK'}</div></div>${a?`<div class="meta" style="margin-top:15px">Current APK: <b>${esc(a.originalName)}</b> · ${size(a.size)}</div>`:''}<div class="actions"><input class="file" id="f-${esc(p.id)}" type="file" accept=".apk,application/vnd.android.package-archive"><button class="btn primary" onclick="upload('${encodeURIComponent(p.id)}')">${a?'Replace APK':'Upload APK'}</button>${a?`<a class="btn" href="/admin/apk/download/${encodeURIComponent(p.id)}">Download</a><button class="btn danger" onclick="removeApk('${encodeURIComponent(p.id)}')">Remove APK</button>`:''}</div><div class="small">Maximum upload size: 250 MB. Only .apk files are accepted.</div></div>`}).join('')}
async function upload(id){id=decodeURIComponent(id);const input=document.getElementById('f-'+id);if(!input||!input.files[0])return show('Select an APK first.');const fd=new FormData();fd.append('apk',input.files[0]);try{const r=await fetch('/api/admin/products/'+encodeURIComponent(id)+'/apk',{method:'POST',headers:{Authorization:auth},body:fd});const d=await r.json();if(!r.ok)throw new Error(d.error||'Upload failed');show('APK uploaded successfully.');load()}catch(e){show(e.message)}}
async function removeApk(id){id=decodeURIComponent(id);if(!confirm('Remove this product APK?'))return;try{const r=await fetch('/api/admin/products/'+encodeURIComponent(id)+'/apk',{method:'DELETE',headers:{Authorization:auth}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Remove failed');show('APK removed.');load()}catch(e){show(e.message)}}
load();
</script></body></html>
